name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please provide enough detail for us to reproduce it.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed secrets, credentials, personal information, and other sensitive data.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and why it appears incorrect.
      placeholder: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction you can.
      placeholder: |
        1. Start...
        2. Open...
        3. Tap/click...
        4. Observe...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release version, build number, or commit SHA if known.
      placeholder: e.g. v0.3.1 or 1a2b3c4

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, device, browser, engine/runtime, and hardware details.
      placeholder: |
        OS:
        Device:
        Browser/runtime:
        Other:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or additional context
      description: Add relevant logs, screenshots, recordings, or other context. Do not include secrets.
      render: shell
